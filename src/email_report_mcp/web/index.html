<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Trợ lý TLC — Quản trị</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <!-- Màn hình đăng nhập -->
  <main id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="brand brand-lg"><span class="logo"></span>
        <span class="brand-text"><span class="brand-name">Trợ lý TLC</span><span class="brand-sub">Trang quản trị</span></span>
      </div>
      <p class="muted" id="login-hint">Đăng nhập để quản lý email, nhóm Zalo và trợ lý.</p>
      <label>Mật khẩu
        <input type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <p class="error" id="login-error" hidden></p>
      <button class="btn primary block lg" type="submit">Đăng nhập</button>
    </form>
  </main>

  <!-- Ứng dụng -->
  <div id="app" class="shell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Điều hướng">
      <div class="brand"><span class="logo"></span>
        <span class="brand-text"><span class="brand-name">Trợ lý TLC</span><span class="brand-sub">Trang quản trị</span></span>
      </div>
      <nav class="nav" id="tabs">
        <a href="#/overview" data-view="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Tổng quan</span></a>

        <div class="nav-group">Email</div>
        <a href="#/pending" data-view="pending">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>
          <span>Chờ duyệt</span><span class="count" id="pending-count" hidden></span></a>
        <a href="#/reports" data-view="reports">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          <span>Email đã lưu</span></a>
        <a href="#/rules" data-view="rules">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
          <span>Quy tắc lọc</span></a>
        <a href="#/imports" data-view="imports">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <span>Nhật ký nhập</span></a>

        <div class="nav-group">Zalo</div>
        <a href="#/zalo" data-view="zalo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 21l1.8-5.5A8 8 0 1 1 21 12z"/></svg>
          <span>Nhóm Zalo</span></a>
        <a href="#/replies" data-view="replies">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-4l-3 4z"/><path d="M8 8h8M8 12h5"/></svg>
          <span>Trợ lý trả lời</span></a>

        <div class="nav-group">Danh mục</div>
        <a href="#/employees" data-view="employees">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8m6 9a7 7 0 0 0-4-6.3"/></svg>
          <span>Nhân viên</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="muted small" id="today-label"></div>
        <button class="btn ghost sm" id="logout" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
          Đăng xuất</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="mobilebar">
        <button class="btn ghost icon" id="menu-btn" type="button" aria-label="Mở menu" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="brand"><span class="logo"></span><span class="brand-name">Trợ lý TLC</span></div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/assets/app.js"></script>
</body>
</html>
