# Dùng khi VPS ĐÃ CÓ nginx chạy trên host (cổng 80/443 đã bị chiếm), app chạy bằng: docker compose up -d --build app
# Cài:  cp nginx/host-tlc.mcv.network.conf /etc/nginx/sites-available/tlc.mcv.network
#       ln -s /etc/nginx/sites-available/tlc.mcv.network /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
#       certbot --nginx -d tlc.mcv.network      (certbot tự thêm khối HTTPS + chuyển hướng 80 -> 443)

# Ghi log KHÔNG kèm query string để API key (?key=...) không bị lưu lại
log_format mcp_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name tlc.mcv.network;
    access_log /var/log/nginx/tlc.mcv.network.access.log mcp_safe;

    # Lô email đẩy từ Apps Script có thể vài MB
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # MCP dùng streaming (SSE): không đệm, cho phép kết nối dài
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
